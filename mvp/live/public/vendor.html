<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E9F6E">
<title>Talat Pay · ຮ້ານ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%229%22 fill=%22%230E9F6E%22/%3E%3Cpath d=%22M9 9h5v5H9zM18 9h5v5h-5zM9 18h5v5H9zM18 18h2v2h-2zM21 21h2v2h-2z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700&family=Noto+Sans+Lao:wght@500;700&display=swap">
<link rel="stylesheet" href="/talat.css">
<script src="/lib/qrcode.js"></script>
<style>
/* Vendor phone. Lao first, English switch. Four tabs: Home, Sales, Alerts, Me. Nothing appears twice. */
.app[lang="lo"] .cap,.app[lang="lo"] .row .meta{font-size:14px}
.app[lang="lo"] .tab{font-size:12.5px}

.qr-hero{background:var(--qr-hero);color:#fff;border-radius:0 0 32px 32px;padding:14px 20px 22px;display:grid;justify-items:center;gap:16px;transition:background .3s}
.qr-hero.cn{background:var(--qr-hero-cn)}
.hero-top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero-top .shop{font-weight:700;font-size:17px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{background:rgba(255,255,255,.16);color:#fff}
.live.off{background:var(--marigold-soft);color:var(--ink)}
.qr-frame{width:min(100%,300px);background:#fff;border:7px solid #0B2B26;border-radius:26px;padding:10px}
.qr-frame canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated}
.qr-hero .seg{max-width:300px;background:rgba(255,255,255,.16);box-shadow:none}
.qr-hero .seg button{color:#fff}
.qr-hero .seg button[aria-pressed="true"]{color:#0B2B26}
.qr-hero .seg .knob{background:#fff}
.qr-note{font-size:12.5px;opacity:.9;text-align:center;margin-top:-6px}

.home-below{display:grid;gap:12px;padding-top:14px}
.qrcap{text-align:center;margin:0 8px}
.soundcard{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--marigold-soft);box-shadow:none}
.soundcard svg{width:28px;height:28px;flex:none}
.soundcard b{display:block;font-size:15px}
.sales-card{display:grid;gap:2px;text-align:left;width:100%}
.metric{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.1;color:var(--jade-strong)}

.bigtotal{font-size:44px;line-height:1.05;color:var(--jade-strong)}
.statrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.statrow .card{padding:14px}
.statrow .num{font-size:22px}
.day{font-size:13px;font-weight:700;color:var(--ink-2);margin:18px 6px 8px}
.setrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow>svg{width:24px;height:24px;flex:none;color:var(--ink-2)}
.setrow>svg.chev{width:20px;height:20px}
.setrow .main{flex:1;min-width:0}
.setrow b{display:block;font-size:15px}
.code{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.12em}
.steps{margin:0;padding-left:22px;display:grid;gap:8px}

.setup-hero{background:var(--qr-hero);color:#fff;border-radius:0 0 32px 32px;padding:22px 20px 26px}
.setup-hero h1{font-family:var(--f-display);font-weight:800;font-size:30px;margin:6px 0 4px;line-height:1.15}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px;font-weight:700;margin:22px 4px 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.codein input{text-transform:uppercase;letter-spacing:.2em;font-weight:700}
.langmini{display:flex;justify-content:flex-end}
.langmini .seg{width:auto;background:rgba(255,255,255,.16);box-shadow:none}
.langmini .seg button{min-width:52px;color:#fff}
.langmini .seg button[aria-pressed="true"]{color:#0B2B26}
.langmini .seg .knob{background:#fff}

#sticker{position:fixed;inset:0;z-index:40;background:var(--paper);overflow:auto;padding:20px 16px;display:grid;justify-items:center;align-content:start;gap:14px;text-align:center}
#sticker .paper{background:#fff;color:#0B2B26;border-radius:24px;padding:22px;width:min(100%,360px);display:grid;gap:10px;justify-items:center;box-shadow:var(--shadow)}
#sticker canvas{width:100%;aspect-ratio:1;image-rendering:pixelated}
#sticker .scanline{font-weight:700;font-size:16px}
#sticker .btns{display:flex;gap:10px}
@media print{
  body{background:#fff}
  .app>*:not(#sticker){display:none!important}
  #sticker{position:static;background:#fff}
  #sticker .btns,#sticker .cap{display:none}
  #sticker .paper{box-shadow:none;border:2px solid #0B2B26}
}
</style>
</head>
<body>
<div class="app" id="app" lang="lo">
  <div class="testband" id="band"></div>
  <main class="view" id="view"></main>
  <nav class="tabbar" id="tabs" hidden></nav>
</div>
<script>
"use strict";
/* ---------- state ---------- */
const store={get(k,d){try{const v=localStorage.getItem("talat."+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("talat."+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem("talat."+k)}catch(e){}}};
const S={lang:store.get("lang","lo"),shop:null,sales:[],ids:new Set(),tab:"home",via:store.get("via","lao"),salesRange:"today",
  sound:store.get("sound",true),awake:store.get("awake",true),unlocked:false,unseen:0,conn:"connecting",loaded:false,fresh:new Set()};
const L=(lo,en)=>S.lang==="en"?en:lo;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Math.round(n).toLocaleString("en-US");
const kip=n=>"₭ "+fmt(n);
const TZ="Asia/Vientiane";
const dayKey=t=>new Date(t).toLocaleDateString("en-CA",{timeZone:TZ});
const hhmm=t=>new Date(t).toLocaleTimeString("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
const COUNTRY={TH:["ໄທ","Thailand"],CN:["ຈີນ","China"],VN:["ຫວຽດນາມ","Vietnam"],KH:["ກຳປູເຈຍ","Cambodia"],LA:["ລາວ","Laos"]};
const country=c=>COUNTRY[c]?L(...COUNTRY[c]):c;
const APP_LO={"Thai bank app":"ແອັບທະນາຄານໄທ","Vietnamese bank app":"ແອັບທະນາຄານຫວຽດນາມ","Cambodian bank app":"ແອັບທະນາຄານກຳປູເຈຍ",
  "Lao bank app":"ແອັບທະນາຄານລາວ","UnionPay app":"ແອັບ UnionPay","Alipay":"Alipay","WeChat Pay":"WeChat Pay"};
const appName=a=>S.lang==="en"?a:(APP_LO[a]||a);
const ICO={
  home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',chart:'<path d="M5 19V9M12 19V5M19 19v-7"/>',
  bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2.5h-15z"/><path d="M10 21a2 2 0 0 0 4 0"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 20a8 7 0 0 1 16 0"/>',
  chev:'<path d="M9 5l7 7-7 7"/>',speaker:'<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
  printer:'<path d="M7 9V4h10v5M7 17H5a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2"/><path d="M7 14h10v6H7z"/>',
  phone:'<rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
  out:'<path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/>',coin:'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/>'
};
const ico=(n,cls="")=>`<svg class="line-ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICO[n]}</svg>`;
function toast(msg){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;$("#app").appendChild(t);setTimeout(()=>t.remove(),2600)}
async function api(path,opts){const r=await fetch("/api/shops"+path,opts);const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||r.status),{status:r.status,code:j.error});return j}
const touristUrl=via=>`${location.origin}/tourist?shop=${S.shop.id}&via=${via}`;

function drawQR(canvas,text){
  const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount(),qz=2,size=n+qz*2;
  canvas.width=size;canvas.height=size;const c=canvas.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,size,size);c.fillStyle="#0B2B26";
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))c.fillRect(k+qz,r+qz,1,1);
}
function placeKnobs(){document.querySelectorAll(".seg").forEach(seg=>{const on=seg.querySelector('[aria-pressed="true"]'),k=seg.querySelector(".knob");if(!on||!k)return;k.style.width=on.offsetWidth+"px";k.style.transform=`translateX(${on.offsetLeft}px)`})}
const seg=(items,cur,attr)=>`<div class="seg" role="group"><span class="knob"></span>${items.map(([v,label])=>`<button class="tap" data-${attr}="${v}" aria-pressed="${v===cur}">${label}</button>`).join("")}</div>`;
const langSeg=()=>seg([["lo","ລາວ"],["en","EN"]],S.lang,"lang");

/* ---------- totals ---------- */
function totals(list){const t=list.reduce((a,s)=>a+s.kip,0);return{t,n:list.length,abroad:list.filter(s=>s.country!=="LA").length}}
const todays=()=>{const d=dayKey(Date.now());return S.sales.filter(s=>dayKey(s.at)===d)};
function saleRow(s){return`<div class="row ${S.fresh.has(s.id)?"fresh":""}"><span class="avatar ${s.country==="CN"?"t-sky":s.country==="LA"?"t-marigold":"t-jade"}">${esc(s.country)}</span><div class="main"><div class="title">${esc(appName(s.app))}</div><div class="meta">${country(s.country)} · ${hhmm(s.at)}</div></div><div class="val num money-in">+${kip(s.kip)}</div></div>`}

/* ---------- setup (first run) ---------- */
function vSetup(err){
  $("#tabs").hidden=true;
  return`<header class="setup-hero"><div class="langmini">${langSeg()}</div>
  <div class="num" style="font-size:15px;opacity:.9">Talat Pay</div>
  <h1>${L("ເລີ່ມທົດລອງຮັບເງິນ","Start a test shop")}</h1>
  <div style="opacity:.92">${L("ສ້າງຮ້ານທົດລອງໃນໂທລະສັບເຄື່ອງນີ້ ແລ້ວໃຫ້ໝູ່ສະແກນ QR ດ້ວຍໂທລະສັບອີກເຄື່ອງ.","Create a test shop on this phone, then have a friend scan its QR with another phone.")}</div></header>
  <form class="pad enter" id="createForm" style="display:grid;gap:14px;margin-top:20px" novalidate>
    <div class="field"><label for="fname">${L("ຊື່ຮ້ານ","Shop name")}</label><div class="input"><input id="fname" maxlength="60" autocomplete="off" placeholder="${L("ຕົວຢ່າງ: ຮ້ານເຝີ ແມ່ຄຳ","e.g. Mae Kham's noodles")}"></div></div>
    <div class="field"><label for="farea">${L("ຕະຫຼາດ ຫຼື ສະຖານທີ່","Market or place")}</label><div class="input"><input id="farea" maxlength="60" autocomplete="off" placeholder="${L("ຕົວຢ່າງ: ຕະຫຼາດມືດ ຫຼວງພະບາງ","e.g. Luang Prabang night market")}"></div></div>
    ${err==="name"?`<div class="err" role="alert">${L("ກະລຸນາໃສ່ຊື່ຮ້ານ","Please enter a shop name")}</div>`:""}
    ${err==="net"?`<div class="err" role="alert">${L("ເຊື່ອມຕໍ່ບໍ່ໄດ້ ລອງໃໝ່ອີກຄັ້ງ","Couldn't connect. Try again.")}</div>`:""}
    <button class="btn full tap" type="submit">${L("ສ້າງຮ້ານທົດລອງ","Create test shop")}</button>
  </form>
  <div class="pad"><div class="or">${L("ມີລະຫັດຮ້ານແລ້ວບໍ?","Already have a shop code?")}</div>
  <form id="openForm" style="display:grid;gap:12px" novalidate>
    <div class="input codein"><input id="fcode" maxlength="6" autocomplete="off" autocapitalize="characters" aria-label="${L("ລະຫັດຮ້ານ 6 ຕົວ","6-letter shop code")}" placeholder="ABC234"></div>
    ${err==="code"?`<div class="err" role="alert">${L("ບໍ່ພົບຮ້ານທີ່ມີລະຫັດນີ້","No shop has this code")}</div>`:""}
    <button class="btn full ghost tap" type="submit">${L("ເປີດຮ້ານ","Open shop")}</button>
  </form></div>`;
}

/* ---------- Home ---------- */
function vHome(){
  const T=totals(todays()),recent=S.sales.slice(0,3),cn=S.via==="cn";
  const live=S.conn==="live";
  return`<header class="qr-hero ${cn?"cn":""}">
    <div class="hero-top"><div class="shop">${esc(S.shop.name)}</div>
      <span class="pill live ${live?"":"off"}"><span class="dot"></span>${live?L("ອອນລາຍ","Live"):L("ກຳລັງເຊື່ອມຕໍ່","Connecting")}</span></div>
    <div class="qr-frame"><canvas id="homeqr" role="img" aria-label="${cn?"Alipay · WeChat Pay":"LaoQR"} (${L("ທົດລອງ","test")})"></canvas></div>
    ${seg([["lao","LaoQR"],["cn","Alipay · WeChat"]],S.via,"via")}
    <div class="qr-note">${L("QR ທົດລອງ: ເປີດໜ້າຈ່າຍເງິນທົດລອງ ບໍ່ແມ່ນ QR ທະນາຄານ","Test QR: opens the test payment page, not a bank QR")}</div>
  </header>
  <div class="pad home-below enter">
    <div class="cap qrcap">${cn?L("ສະແກນໄດ້ດ້ວຍ Alipay ແລະ WeChat Pay","Scans with Alipay and WeChat Pay"):L("ສະແກນໄດ້ດ້ວຍແອັບທະນາຄານໄທ, ຫວຽດນາມ, ກຳປູເຈຍ, UnionPay ແລະ ທະນາຄານລາວ","Scans with Thai, Vietnamese and Cambodian bank apps, UnionPay and Lao banks")}</div>
    ${S.sound&&!S.unlocked?`<button class="card soundcard tap" data-act="unlock">${ico("speaker")}<div><b>${L("ແຕະເພື່ອເປີດສຽງແຈ້ງເຕືອນ","Tap to turn on sound alerts")}</b><span class="cap">${L("ບຣາວເຊີຕ້ອງໃຫ້ແຕະໜຶ່ງເທື່ອກ່ອນ ຈຶ່ງຈະມີສຽງ","Browsers need one tap before they can play sound")}</span></div></button>`:""}
    <button class="card sales-card tap" data-go="sales">
      <span class="cap">${L("ຍອດຂາຍມື້ນີ້","Today's sales")}</span>
      <span class="metric" id="metric">${kip(T.t)}</span>
      <span class="cap">${L(`${T.n} ລາຍການ · ${T.abroad} ຈາກຕ່າງປະເທດ`,`${T.n} payments · ${T.abroad} from abroad`)}</span>
    </button>
    <div class="sec" style="margin-top:12px"><div class="sec-title"><h3>${L("ລາຍການລ່າສຸດ","Latest payments")}</h3>${S.sales.length>3?`<button class="tap" data-go="alerts">${L("ເບິ່ງທັງໝົດ","See all")}</button>`:""}</div>
    <div class="card list">${recent.length?recent.map(saleRow).join(""):emptyState()}</div></div>
  </div>`;
}
function emptyState(){return`<div class="empty">${ico("coin")}<h4>${L("ຍັງບໍ່ມີລາຍການ","No payments yet")}</h4><div class="cap">${L("ໃຫ້ໝູ່ສະແກນ QR ດ້ານເທິງດ້ວຍກ້ອງໂທລະສັບ","Have a friend scan the QR above with their phone camera")}</div></div>`}

/* ---------- Sales ---------- */
function vSales(){
  const list=S.salesRange==="today"?todays():S.sales,T=totals(list);
  const byC={},byA={};list.forEach(s=>{byC[s.country]=(byC[s.country]||0)+s.kip;byA[s.app]=(byA[s.app]||0)+s.kip});
  const cRows=Object.entries(byC).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...Object.values(byC));
  const aRows=Object.entries(byA).sort((a,b)=>b[1]-a[1]);
  return`<div class="screen-head"><h2>${L("ຍອດຂາຍ","Sales")}</h2></div>
  <div class="pad enter">
    <div style="margin:8px 0 14px">${seg([["today",L("ມື້ນີ້","Today")],["all",L("ທັງໝົດ","All")]],S.salesRange,"range")}</div>
    <div class="card"><div class="cap">${S.salesRange==="today"?L("ຍອດຂາຍມື້ນີ້","Today's sales"):L("ຍອດຂາຍທັງໝົດ","All sales")}</div><div class="num bigtotal">${kip(T.t)}</div></div>
    <div class="statrow"><div class="card"><div class="cap">${L("ລາຍການ","Payments")}</div><div class="num">${T.n}</div></div>
      <div class="card"><div class="cap">${L("ສະເລ່ຍຕໍ່ລາຍການ","Average")}</div><div class="num">${T.n?kip(T.t/T.n):"–"}</div></div></div>
    <div class="sec"><div class="sec-title"><h3>${L("ລູກຄ້າມາຈາກໃສ","Where buyers are from")}</h3></div>
      <div class="card">${cRows.length?`<div class="bars">${cRows.map(([c,v])=>`<div class="bar-row"><span>${country(c)}</span><div class="track"><div class="fill" style="width:${Math.round(v/max*100)}%"></div></div><span class="num">${kip(v)}</span></div>`).join("")}</div>`:`<div class="cap">${L("ຍັງບໍ່ມີຂໍ້ມູນ","Nothing yet")}</div>`}</div></div>
    <div class="sec"><div class="sec-title"><h3>${L("ຈ່າຍດ້ວຍແອັບໃດ","Paid with")}</h3></div>
      <div class="card list">${aRows.length?aRows.map(([a,v])=>`<div class="row"><div class="main"><div class="title">${esc(appName(a))}</div></div><div class="val num">${kip(v)}</div></div>`).join(""):`<div class="cap" style="padding:12px 0">${L("ຍັງບໍ່ມີຂໍ້ມູນ","Nothing yet")}</div>`}</div></div>
    <p class="cap" style="margin:16px 6px 0">${L("ໜ້ານີ້ນັບຈາກແຈ້ງເຕືອນເທົ່ານັ້ນ ບໍ່ແມ່ນຍອດເງິນໃນບັນຊີ. ໃນແອັບແທ້ ເງິນເຂົ້າບັນຊີທະນາຄານຂອງທ່ານໂດຍກົງເປັນກີບ.","This page counts alerts only, not your bank balance. In the real app the money goes straight into your bank account in kip.")}</p>
  </div>`;
}

/* ---------- Alerts (the one full payment list) ---------- */
function vAlerts(){
  const today=dayKey(Date.now()),yest=dayKey(Date.now()-864e5),groups=[];
  S.sales.forEach(s=>{const d=dayKey(s.at);let g=groups[groups.length-1];if(!g||g.d!==d)groups.push(g={d,items:[]});g.items.push(s)});
  const label=d=>d===today?L("ມື້ນີ້","Today"):d===yest?L("ມື້ວານ","Yesterday"):d;
  return`<div class="screen-head"><h2>${L("ແຈ້ງເຕືອນ","Alerts")}</h2><div class="sub">${L(`ເງິນເຂົ້າທັງໝົດ ${S.sales.length} ລາຍການ`,`${S.sales.length} payments received`)}</div></div>
  <div class="pad enter">${groups.length?groups.map(g=>`<div class="day">${label(g.d)} · ${kip(g.items.reduce((a,s)=>a+s.kip,0))}</div><div class="card list">${g.items.map(saleRow).join("")}</div>`).join(""):`<div class="card" style="margin-top:12px">${emptyState()}</div>`}</div>`;
}

/* ---------- Me ---------- */
function vMe(){
  const lao=laoVoice();
  const sw=(act,on,label)=>`<button class="switch" role="switch" aria-checked="${on}" aria-label="${label}" data-act="${act}"></button>`;
  return`<div class="screen-head"><h2>${L("ຂ້ອຍ","Me")}</h2></div>
  <div class="pad enter" style="display:grid;gap:14px">
    <div class="card"><div class="cap">${L("ຮ້ານ","Shop")}</div><div style="font-weight:700;font-size:18px">${esc(S.shop.name)}</div>${S.shop.area?`<div class="cap">${esc(S.shop.area)}</div>`:""}
      <div class="cap" style="margin-top:12px">${L("ລະຫັດຮ້ານ","Shop code")}</div><div class="code">${esc(S.shop.id)}</div></div>
    <div class="card" style="padding-block:4px">
      <div class="setrow">${ico("speaker")}<div class="main"><b>${L("ສຽງແຈ້ງເຕືອນ","Sound alerts")}</b><span class="cap">${lao?L("ອ່ານຈຳນວນເງິນເປັນພາສາລາວ","Reads the amount in Lao"):L("ໂທລະສັບນີ້ບໍ່ມີສຽງພາສາລາວ ຈຶ່ງມີແຕ່ສຽງກະດິ່ງ","This phone has no Lao voice, so it plays a chime")}</span></div>${sw("sound",S.sound,L("ສຽງແຈ້ງເຕືອນ","Sound alerts"))}</div>
      <button class="setrow tap" data-act="testsound"><span style="width:24px"></span><div class="main"><b>${L("ທົດລອງສຽງ","Test the sound")}</b></div>${ico("chev","chev")}</button>
      <div class="setrow">${ico("sun")}<div class="main"><b>${L("ໜ້າຈໍເປີດຕະຫຼອດ","Keep screen on")}</b><span class="cap">${"wakeLock" in navigator?L("ບໍ່ໃຫ້ໜ້າຈໍດັບ ຂະນະເປີດແອັບ","While this page is open"):L("ບຣາວເຊີນີ້ເຮັດບໍ່ໄດ້","Not supported in this browser")}</span></div>${sw("awake",S.awake,L("ໜ້າຈໍເປີດຕະຫຼອດ","Keep screen on"))}</div>
    </div>
    <div class="card" style="padding-block:4px">
      <button class="setrow tap" data-act="sticker">${ico("printer")}<div class="main"><b>${L("ພິມສະຕິກເກີ QR","Print the QR sticker")}</b></div>${ico("chev","chev")}</button>
      <button class="setrow tap" data-act="share">${ico("phone")}<div class="main"><b>${L("ເປີດຮ້ານນີ້ໃນໂທລະສັບອື່ນ","Open this shop on another phone")}</b><span class="cap">${L("ສຳເນົາລິ້ງ","Copies a link")}</span></div>${ico("chev","chev")}</button>
    </div>
    <div class="card"><div class="cap" style="margin-bottom:8px">${L("ພາສາ","Language")}</div>${langSeg()}</div>
    <div class="card"><b>${L("ມັນເຮັດວຽກແນວໃດ","How it works")}</b><ol class="steps cap" style="margin-top:8px">
      <li>${L("ນັກທ່ອງທ່ຽວສະແກນ QR ຂອງທ່ານດ້ວຍແອັບຂອງເຂົາເອງ","The tourist scans your QR with their own app")}</li>
      <li>${L("ເຂົາໃສ່ລາຄາເປັນກີບ ແລ້ວກົດຈ່າຍ","They enter the price in kip and tap Pay")}</li>
      <li>${L("ໂທລະສັບຂອງທ່ານສົ່ງສຽງ ແລະ ສະແດງຈຳນວນເງິນທັນທີ","Your phone chimes and shows the amount right away")}</li>
      <li>${L("ໃນແອັບແທ້ ເງິນເຂົ້າບັນຊີທະນາຄານຂອງທ່ານເປັນກີບ. ໃນການທົດລອງນີ້ ບໍ່ມີເງິນແທ້.","In the real app the money lands in your bank account in kip. In this test no real money moves.")}</li></ol></div>
    <button class="btn full danger tap" data-act="leave">${ico("out")}${L("ອອກຈາກຮ້ານນີ້","Leave this shop")}</button>
  </div>`;
}

/* ---------- render ---------- */
function renderTabs(){
  const t=(id,icon,lo,en)=>`<button class="tab tap" data-go="${id}" ${S.tab===id?'aria-current="page"':""}><span class="tab-ico">${ico(icon)}${id==="alerts"&&S.unseen?`<span class="badge">${S.unseen>99?"99+":S.unseen}</span>`:""}</span>${L(lo,en)}</button>`;
  const tabs=$("#tabs");tabs.hidden=false;
  tabs.innerHTML=t("home","home","ໜ້າຫຼັກ","Home")+t("sales","chart","ຍອດຂາຍ","Sales")+t("alerts","bell","ແຈ້ງເຕືອນ","Alerts")+t("me","me","ຂ້ອຍ","Me");
}
let lastView="";
function render(err){
  $("#app").lang=S.lang;document.documentElement.lang=S.lang;
  $("#band").textContent=L("ເງິນທົດລອງ · ບໍ່ແມ່ນເງິນແທ້","Test money · not real");
  if(!S.shop){lastView="";$("#view").innerHTML=vSetup(err);requestAnimationFrame(placeKnobs);return}
  if(S.tab==="alerts")S.unseen=0;
  $("#view").innerHTML={home:vHome,sales:vSales,alerts:vAlerts,me:vMe}[S.tab]();
  renderTabs();
  /* Fade in only when the tab changes, not when a payment arrives. */
  if(S.tab===lastView)$("#view").querySelectorAll(".enter").forEach(e=>e.classList.remove("enter"));lastView=S.tab;
  const qr=$("#homeqr");if(qr)drawQR(qr,touristUrl(S.via));
  requestAnimationFrame(placeKnobs);
  S.fresh.clear();
}
function go(tab){S.tab=tab;render();window.scrollTo(0,0)}

/* ---------- sound, voice, screen ---------- */
let ac=null;
function unlockAudio(){
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC&&!ac)ac=new AC();if(ac&&ac.state==="suspended")ac.resume()}catch(e){}
  try{if("speechSynthesis" in window){const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}}catch(e){}
  if(!S.unlocked){S.unlocked=true;if(S.shop&&S.tab==="home")render()}
  keepAwake();
}
function chime(){if(!ac)return;try{[[880,0],[1318.5,.14],[1760,.28]].forEach(([f,t])=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.35,ac.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+.4);
  o.connect(g).connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.45)})}catch(e){}}
function laoVoice(){try{return speechSynthesis.getVoices().find(v=>/^lo(-|_|$)/i.test(v.lang))||null}catch(e){return null}}
function speak(k){const v=laoVoice();if(!v)return false;try{const u=new SpeechSynthesisUtterance(`ໄດ້ຮັບເງິນ ${k} ກີບ`);u.voice=v;u.lang=v.lang;u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u);return true}catch(e){return false}}
function announce(k){if(!S.sound)return false;chime();setTimeout(()=>speak(k),650);try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}return !!laoVoice()}
let wake=null;
async function keepAwake(){if(!S.awake||!("wakeLock" in navigator)||document.visibilityState!=="visible"||wake)return;
  try{wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}catch(e){wake=null}}
function releaseAwake(){try{wake&&wake.release()}catch(e){}wake=null}

/* ---------- payment alert overlay ---------- */
let alertTimer;
function showAlert(s){
  document.querySelectorAll(".success").forEach(e=>e.remove());clearTimeout(alertTimer);
  const voiced=announce(s.kip);
  const el=document.createElement("div");el.className="success";el.setAttribute("role","alert");
  el.innerHTML=`<div class="burst">${[[-58,-40],[56,-46],[-62,30],[60,26],[-8,-68],[20,66]].map(([x,y])=>`<i class="coin" style="--dx:${x}px;--dy:${y}px"></i>`).join("")}<svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="50" fill="#0E9F6E"/><circle cx="75" cy="75" r="40" fill="#09845A"/><path class="check" d="M55 76l13 13 27-29" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="cap">${esc(appName(s.app))} · ${country(s.country)} · ${hhmm(s.at)}</div>
  <div class="big num money-in">+${kip(s.kip)}</div>
  <div class="speak" lang="lo">ໄດ້ຮັບເງິນ ${fmt(s.kip)} ກີບ</div>
  ${S.sound&&!S.unlocked?`<div class="cap">${L("ສຽງຍັງປິດຢູ່: ແຕະໜ້າຈໍໜຶ່ງເທື່ອເພື່ອເປີດ","Sound is still off: tap the screen once to turn it on")}</div>`:S.sound&&!voiced?`<div class="cap">${L("ໂທລະສັບນີ້ບໍ່ມີສຽງພາສາລາວ ຈຶ່ງມີແຕ່ສຽງກະດິ່ງ","No Lao voice on this phone, so it played a chime")}</div>`:""}
  <button class="btn tap" data-act="ack" style="min-width:160px">${L("ຕົກລົງ","OK")}</button>`;
  $("#app").appendChild(el);alertTimer=setTimeout(()=>el.remove(),8000);
}

/* ---------- sales sync: WebSocket first, polling as a fallback ---------- */
function addSales(list,announceNew){
  const fresh=list.filter(s=>!S.ids.has(s.id));if(!fresh.length)return;
  fresh.forEach(s=>{S.ids.add(s.id);S.fresh.add(s.id)});
  S.sales=S.sales.concat(fresh).sort((a,b)=>b.id-a.id);
  if(announceNew){if(S.tab!=="alerts")S.unseen+=fresh.length;showAlert(fresh.reduce((a,b)=>a.id>b.id?a:b))}
  render();
}
async function catchUp(){
  try{const {sales}=await api(`/${S.shop.id}/sales`);addSales(sales,S.loaded);S.loaded=true}
  catch(e){if(e.status===404){toast(L("ບໍ່ພົບຮ້ານນີ້ໃນເຊີບເວີ","This shop is no longer on the server"))}}
}
let ws=null,retryTimer=null,backoff=1000;
function setConn(c){if(S.conn===c)return;S.conn=c;if(S.shop&&S.tab==="home")render()}
function connect(){
  if(!S.shop)return;clearTimeout(retryTimer);
  const proto=location.protocol==="https:"?"wss":"ws";
  try{ws=new WebSocket(`${proto}://${location.host}/api/shops/${S.shop.id}/ws`)}catch(e){return retry()}
  ws.onopen=()=>{backoff=1000;lastPong=Date.now();setConn("live");catchUp()};
  ws.onmessage=e=>{lastPong=Date.now();if(e.data==="pong")return;let m;try{m=JSON.parse(e.data)}catch(x){return}if(m.type==="sale")addSales([m.sale],true)};
  ws.onclose=()=>{ws=null;setConn("off");retry()};
  ws.onerror=()=>{try{ws&&ws.close()}catch(x){}};
}
function retry(){clearTimeout(retryTimer);retryTimer=setTimeout(connect,backoff);backoff=Math.min(backoff*2,15000)}
function disconnect(){clearTimeout(retryTimer);if(ws){ws.onclose=null;try{ws.close()}catch(e){}ws=null}}
/* Ping every 10 s. A phone that drops off the network often leaves the socket looking open, so no pong for 25 s means reconnect. */
let lastPong=Date.now();
setInterval(()=>{if(!S.shop)return;
  if(ws&&ws.readyState===1){if(Date.now()-lastPong>25000){disconnect();setConn("off");connect();return}ws.send("ping")}
  else catchUp()},10000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.shop){keepAwake();catchUp();if(!ws)connect()}});

async function openShop(id){
  const info=await api(`/${id}`);S.shop={id:info.id,name:info.name,area:info.area};store.set("shop",S.shop);
  S.sales=[];S.ids=new Set();S.loaded=false;S.tab="home";
  await catchUp();render();connect();
}

/* ---------- sticker (print) ---------- */
function showSticker(){
  const el=document.createElement("div");el.id="sticker";
  el.innerHTML=`<div class="paper"><div style="font-weight:700;font-size:20px">${esc(S.shop.name)}</div>
    <canvas id="stickerqr" aria-label="QR"></canvas>
    <div class="scanline">ສະແກນເພື່ອຈ່າຍ · Scan to pay · 扫码付款</div>
    <div style="font-size:13px">${S.via==="cn"?"Alipay · WeChat Pay":"LaoQR"} · ${L("ລະຫັດ","Code")} <b>${esc(S.shop.id)}</b></div>
    <div style="font-size:12px;font-weight:700;background:#FFF0CC;border-radius:99px;padding:4px 10px">${L("ທົດລອງເທົ່ານັ້ນ · Test only","Test only · ທົດລອງເທົ່ານັ້ນ")}</div></div>
    <div class="cap">${L("ສະຕິກເກີນີ້ໃຊ້ QR ທີ່ເລືອກຢູ່ໜ້າຫຼັກ","This sticker uses the QR selected on Home")}</div>
    <div class="btns"><button class="btn tap" data-act="print">${ico("printer")}${L("ພິມ","Print")}</button><button class="btn ghost tap" data-act="closesticker">${L("ປິດ","Close")}</button></div>`;
  $("#app").appendChild(el);drawQR($("#stickerqr"),touristUrl(S.via));
}

/* ---------- events ---------- */
document.addEventListener("pointerdown",()=>{if(S.sound&&!S.unlocked)unlockAudio();else keepAwake()},{capture:true});
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-go],[data-act],[data-lang],[data-via],[data-range]");if(!el)return;const d=el.dataset;
  if(d.go)return go(d.go);
  if(d.lang){S.lang=d.lang;store.set("lang",S.lang);return render()}
  if(d.via){S.via=d.via;store.set("via",S.via);return render()}
  if(d.range){S.salesRange=d.range;return render()}
  switch(d.act){
    case "unlock":unlockAudio();chime();break;
    case "ack":el.closest(".success").remove();break;
    case "sound":S.sound=!S.sound;store.set("sound",S.sound);if(S.sound)unlockAudio();render();break;
    case "awake":S.awake=!S.awake;store.set("awake",S.awake);S.awake?keepAwake():releaseAwake();render();break;
    case "testsound":unlockAudio();showAlert({id:0,kip:25000,app:"Thai bank app",country:"TH",at:Date.now()});break;
    case "sticker":showSticker();break;
    case "print":window.print();break;
    case "closesticker":$("#sticker").remove();break;
    case "share":{const link=`${location.origin}/vendor?shop=${S.shop.id}`;
      try{await navigator.clipboard.writeText(link);toast(L("ສຳເນົາລິ້ງແລ້ວ","Link copied"))}catch(x){prompt(L("ສຳເນົາລິ້ງນີ້","Copy this link"),link)}break}
    case "leave":if(confirm(L("ອອກຈາກຮ້ານນີ້ໃນໂທລະສັບເຄື່ອງນີ້ບໍ? ລາຍການຍັງຢູ່ໃນເຊີບເວີ.","Leave this shop on this phone? Its payments stay on the server."))){
      disconnect();store.del("shop");S.shop=null;S.sales=[];S.ids=new Set();history.replaceState(null,"","/vendor");render()}break;
  }
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target,btn=f.querySelector("button[type=submit]");
  if(f.id==="createForm"){
    const name=$("#fname").value.trim(),area=$("#farea").value.trim();if(!name)return render("name");
    btn.disabled=true;
    try{const {id}=await api("",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name,area})});await openShop(id)}
    catch(x){render("net")}
  }
  if(f.id==="openForm"){
    const id=$("#fcode").value.trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(id))return render("code");
    btn.disabled=true;
    try{await openShop(id)}catch(x){render(x.status===404||x.status===400?"code":"net")}
  }
});
addEventListener("resize",placeKnobs);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeKnobs);
try{speechSynthesis.onvoiceschanged=()=>{if(S.tab==="me")render()}}catch(e){}

/* ---------- start ---------- */
(async()=>{
  const fromUrl=(new URLSearchParams(location.search).get("shop")||"").toUpperCase();
  const saved=store.get("shop",null);
  const id=/^[A-Z2-9]{6}$/.test(fromUrl)?fromUrl:saved&&saved.id;
  if(id){S.shop=saved&&saved.id===id?saved:{id,name:"…",area:""};render();
    try{await openShop(id)}catch(x){if(x.status===404||x.status===400){store.del("shop");S.shop=null;render("code")}else{render();connect()}}}
  else render();
})();
</script>
